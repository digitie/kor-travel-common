# ADR-019: 정책 데이터 세 파일과 Node/npm 도구 축을 호출자가 고정한 common-ref에서 읽는다.
# common main은 checkout하지 않는다. 최신 정본과의 차이는 frontend-guard-lag-report가 보고한다.
name: common frontend consumer guard
on:
  workflow_call:
    inputs:
      common-ref:
        description: "호출 SHA와 같은 common 40자리 커밋. 정책·검사기·Node/npm 축을 모두 이 커밋에서 읽는다"
        required: true
        type: string
      frontends:
        description: "package/lock/workspace/profile 경로를 담는 JSON 배열"
        required: true
        type: string
      toolchain-manifests:
        description: "추가 private anchor 또는 workspace manifest 경로 JSON 배열"
        required: false
        default: '[]'
        type: string
      node-dockerfiles:
        description: "생산 Node Dockerfile 경로 JSON 배열"
        required: false
        default: '[]'
        type: string
      root:
        description: "검사 기준 디렉터리(소비자 저장소 상대). 위 경로들과 .nvmrc를 이 디렉터리 기준으로 찾는다"
        required: false
        default: .
        type: string
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJSON(inputs.frontends) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: common
          repository: digitie/kor-travel-common
          ref: ${{ inputs.common-ref }}
          persist-credentials: false
      - name: common-ref와 호출 판 확인
        working-directory: common
        env:
          COMMON_REF: ${{ inputs.common-ref }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          if ! [[ "$COMMON_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::common-ref는 40자리 커밋 SHA여야 합니다"; exit 1
          fi
          test "$(git rev-parse HEAD)" = "$COMMON_REF"
          echo "정책·검사기·도구 축 revision: $COMMON_REF"
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::warning::job.workflow_sha를 읽을 수 없어 호출 SHA와 common-ref 일치를 확인하지 못했습니다"
          elif [ "$WORKFLOW_REPOSITORY" = "$CALLER_REPOSITORY" ]; then
            echo "common 자체 호출(selftest)은 고정 시험 ref를 쓰므로 호출 판 일치를 확인하지 않습니다"
          elif [ "$WORKFLOW_SHA" != "$COMMON_REF" ]; then
            echo "::error::호출 SHA($WORKFLOW_SHA)와 common-ref($COMMON_REF)는 같은 40자리 값이어야 합니다"; exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: common/.nvmrc
      - name: 중앙 검사 환경
        working-directory: common
        run: |
          npm_version="$(jq -r '.axes.npm.recommended' versions.json)"
          if ! [[ "$npm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::common-ref의 axes.npm.recommended가 정확한 세 자리 버전이 아닙니다"; exit 1
          fi
          npm install --global "npm@$npm_version"
          echo "검사기 실행 Node $(node --version) / npm $(npm --version)"
          npm ci --ignore-scripts --engine-strict
          npm run check:toolchain
      - name: common-ref 정책·산출물과 소비자 대조
        env:
          FRONTEND: ${{ toJSON(matrix.frontend) }}
          KT_REQUIRE_CANONICAL: '1'
          CONSUMER_ROOT: ${{ inputs.root }}
          TOOLCHAIN_MANIFESTS: ${{ inputs.toolchain-manifests }}
          NODE_DOCKERFILES: ${{ inputs.node-dockerfiles }}
        run: |
          node --input-type=module <<'JS'
          import { resolve, relative, dirname, isAbsolute } from "node:path";
          import { spawnSync } from "node:child_process";
          const config = JSON.parse(process.env.FRONTEND);
          const checkout = resolve("consumer");
          function inside(base, value, label) {
            if (typeof value !== "string" || !value) throw new Error(label + " 경로 누락");
            const result = resolve(base, value), rel = relative(base, result);
            if (rel === ".." || rel.startsWith("../") || isAbsolute(rel)) throw new Error("기준 디렉터리 밖 " + label + " 경로 거부");
            return result;
          }
          const root = inside(checkout, process.env.CONSUMER_ROOT || ".", "기준 디렉터리");
          const packagePath = inside(root, config.package, "검사"), lockPath = inside(root, config.lock, "검사");
          const args = [
            resolve("common/tools/check_frontend_dependencies.mjs"),
            "--package", packagePath, "--lock", lockPath,
            "--workspace", config.workspace ?? "", "--profile", config.profile ?? "web",
            "--artifacts", resolve(dirname(packagePath), "common-artifacts.json"),
            "--policy", resolve("common/frontend-dependencies.json"),
            "--canonical", resolve("common/frontend-artifacts.json"),
          ];
          const result = spawnSync(process.execPath, args, { stdio: "inherit", env: process.env });
          if (result.error) throw result.error;
          if (result.status !== 0) process.exit(result.status ?? 1);
          const toolchain = spawnSync("npm", [
            "run", "check:toolchain", "--", "--root", root,
            "--registry", resolve("common/versions.json"),
            "--manifest", config.package,
            "--manifests", process.env.TOOLCHAIN_MANIFESTS,
            "--dockerfiles", process.env.NODE_DOCKERFILES,
          ], { cwd: resolve("common"), stdio: "inherit", env: process.env });
          if (toolchain.error) throw toolchain.error;
          process.exit(toolchain.status ?? 1);
          JS
      - name: 공통 검사기 회귀 검증
        working-directory: common
        run: |
          npm run test:toolchain
          npm run check:policy
