name: common versions check

on:
  workflow_call:
    inputs:
      name:
        description: "호출 저장소에서 보일 job 이름"
        required: true
        type: string
      repo:
        description: "versions.json consumers key 또는 alias"
        required: true
        type: string
      lockfiles:
        description: "호출 저장소 루트 기준 lockfile 경로 JSON 배열"
        required: true
        type: string
      common-ref:
        description: "검사기에 사용할 common 태그 또는 40자 commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: common-versions-${{ github.repository }}-${{ github.ref }}-${{ inputs.name }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 호출 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: common checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: digitie/kor-travel-common
          ref: ${{ inputs.common-ref }}
          path: .kor-travel-common
          fetch-depth: 1
          persist-credentials: false

      - name: Python 설치
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: immutable ref와 lockfile 확인
        env:
          COMMON_REF: ${{ inputs.common-ref }}
          LOCKFILES: ${{ inputs.lockfiles }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMON_REF" =~ ^[0-9a-f]{40}$ || "$COMMON_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$COMMON_REF" != "main" && "$COMMON_REF" != "master" ]]
          python - "$LOCKFILES" "$GITHUB_WORKSPACE" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              entries = json.loads(sys.argv[1])
          except json.JSONDecodeError as exc:
              raise SystemExit(f"lockfiles JSON 오류: {exc}")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("lockfiles는 비어 있지 않은 JSON 배열이어야 합니다")
          root = Path(sys.argv[2]).resolve()
          for entry in entries:
              if not isinstance(entry, str) or not entry.strip():
                  raise SystemExit("lockfiles 항목은 문자열이어야 합니다")
              path = Path(entry)
              if path.is_absolute() or "\\" in entry or any(part in {"", ".", ".."} for part in entry.split("/")):
                  raise SystemExit(f"lockfile 경로가 안전하지 않습니다: {entry}")
              resolved = (root / path).resolve()
              if root not in resolved.parents or not resolved.is_file():
                  raise SystemExit(f"lockfile이 없습니다: {entry}")
          PY

      - name: 버전 report 실행
        env:
          REPO: ${{ inputs.repo }}
          LOCKFILES: ${{ inputs.lockfiles }}
          COMMON_REF: ${{ inputs.common-ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kor-travel-common-ci/versions
          mapfile -t lockfile_dirs < <(python - "$LOCKFILES" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          for entry in dict.fromkeys(json.loads(sys.argv[1])):
              parent = PurePosixPath(entry).parent.as_posix()
              print("." if parent == "." else parent)
          PY
          )
          index=0
          for directory in "${lockfile_dirs[@]}"; do
            python -B -X utf8 .kor-travel-common/tools/check_versions.py \
              "$GITHUB_WORKSPACE/$directory" \
              --registry .kor-travel-common/versions.json \
              --repo "$REPO" \
              --json ".kor-travel-common-ci/versions/report-${index}.json"
            index=$((index + 1))
          done
          printf '검사 source: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'common ref: `%s`\n' "$COMMON_REF" >> "$GITHUB_STEP_SUMMARY"
