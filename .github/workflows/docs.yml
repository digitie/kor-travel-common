name: docs

on:
  push:
    branches: [main, 'codex/release-*']
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: 검사 source SHA 확인
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '검사 source: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: 문서·계획·회귀 검사
        run: |
          python -B -X utf8 tools/validate_document_links.py
          python -B -X utf8 tools/validate_plan.py
          python -B -X utf8 -m unittest discover -s tests -p 'test_*.py'
      - name: 변경 공백 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: 운영 정보 전체 트리 검사
        run: python -B -X utf8 tools/check_prod_redaction.py --all

  tools:
    name: tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: 검사 source SHA 확인
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '검사 source: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Windows·Ubuntu 도구 검증
        run: |
          python -B -X utf8 tools/validate_document_links.py
          python -B -X utf8 tools/validate_plan.py
          python -B -X utf8 -m unittest discover -s tests -p 'test_*.py'
          python -B -X utf8 tools/check_versions.py --self-check
          python -B -X utf8 tools/check_spdx.py
          python -B -X utf8 tools/scan_secrets.py --all
          python -B -X utf8 tools/check_prod_redaction.py --all

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: 검사 source SHA 확인
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '검사 source: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: 비밀 값 전체 트리 검사
        run: python -B -X utf8 tools/scan_secrets.py --all

  check-versions:
    name: check-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: 검사 source SHA 확인
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '검사 source: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: 버전 레지스트리 자기 검사
        run: python -B -X utf8 tools/check_versions.py --self-check
      - name: 고정 fixture의 report와 step summary 검증
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '검사 source: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '\n다음 표는 고정 CI fixture이며 소비자 실측이 아닙니다.\n' >> "$GITHUB_STEP_SUMMARY"
          python -B -X utf8 tools/check_versions.py tests/fixtures/version-report --repo common-ci-report-fixture --mode report --json dist/ci/version-report.json
          python -B -X utf8 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('dist/ci/version-report.json').read_text(encoding='utf-8'))
          assert data['mode'] == 'report'
          assert data['summary']['BELOW_FLOOR'] >= 1 and data['findings']
          summary = Path(os.environ['GITHUB_STEP_SUMMARY']).read_text(encoding='utf-8')
          assert 'BELOW_FLOOR' in summary and os.environ['SOURCE_SHA'] in summary
          digest = hashlib.sha256(Path('dist/ci/version-report.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(f'\n보고 SHA256: `{digest}`, source: `{os.environ["SOURCE_SHA"]}`\n')
          print(f'보고 SHA256: {digest}, source: {os.environ["SOURCE_SHA"]}')
          print('fixture report·비어 있지 않은 step summary 확인')
          PY

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 검사 source SHA 확인
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '검사 source: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Node.js 설치
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm 고정 버전 설치
        run: npm install -g npm@11.19.1
      - name: workspace 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: tokens 패키지 빌드·검사·테스트
        run: |
          npm run lint --if-present --workspace packages/tokens
          npm run type-check --if-present --workspace packages/tokens
          npm run check --workspace packages/tokens
          npm run build --workspace packages/tokens
          npm run check --workspace packages/tokens
          git diff --exit-code -- packages/tokens/dist packages/tokens/dark-media.css
          npm test --workspace packages/tokens
      - name: tarball 설치 스모크
        run: |
          package_dir="$(mktemp -d)"
          tarball_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir" "$tarball_dir"' EXIT
          npm pack --workspace packages/tokens --pack-destination "$tarball_dir"
          tarball="$(find "$tarball_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          (
            cd "$package_dir"
            npm init -y >/dev/null
            npm install --ignore-scripts --no-audit --no-fund "$tarball"
            node --input-type=module - <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          for (const subpath of [
            '@kor-travel/tokens',
            '@kor-travel/tokens/tokens.css',
            '@kor-travel/tokens/theme.css',
            '@kor-travel/tokens/shadcn.css',
            '@kor-travel/tokens/base.css',
            '@kor-travel/tokens/base.scoped.css',
            '@kor-travel/tokens/dark-class.css',
            '@kor-travel/tokens/dark-media.css',
            '@kor-travel/tokens/tokens.json',
            '@kor-travel/tokens/tailwind-preset',
          ]) {
            console.log(`${subpath}: ${require.resolve(subpath)}`);
          }
          NODE
          )
          printf 'tarball source: `%s`, source SHA: `%s`\n' "$(basename "$tarball")" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
