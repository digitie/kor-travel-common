name: workflows selftest

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/**'
      - 'tests/fixtures/**'
      - 'consumers.pins.json'
      - 'tests/test_consumer_pins.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/**'
      - 'tests/fixtures/**'
      - 'consumers.pins.json'
      - 'tests/test_consumer_pins.py'

permissions:
  contents: read

concurrency:
  group: workflows-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions-node:
    uses: ./.github/workflows/versions-check.yml
    with:
      name: versions (node fixture)
      repo: common-ci-report-fixture
      lockfiles: '["tests/fixtures/node-app/package-lock.json"]'
      common-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  versions-python:
    uses: ./.github/workflows/versions-check.yml
    with:
      name: versions (python fixture)
      repo: common-ci-report-fixture
      lockfiles: '["tests/fixtures/python-app/uv.lock"]'
      common-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  docs-node:
    uses: ./.github/workflows/docs-check.yml
    with:
      name: docs (node fixture)
      common-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      link-check: true
      redaction-patterns-file: .prod-redaction-patterns
      redaction-scope: tests/fixtures/node-app
      task-ledger: false

  docs-python:
    uses: ./.github/workflows/docs-check.yml
    with:
      name: docs (python fixture)
      common-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      link-check: true
      redaction-patterns-file: .prod-redaction-patterns
      redaction-scope: tests/fixtures/python-app
      task-ledger: false

  contrast-node:
    uses: ./.github/workflows/contrast-check.yml
    with:
      name: contrast (node fixture)
      common-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      tokens-css: .kor-travel-common/packages/tokens/tokens.css
      override-css: tests/fixtures/node-app/contrast-overrides.css
      dark: false

  contrast-python:
    uses: ./.github/workflows/contrast-check.yml
    with:
      name: contrast (python fixture)
      common-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      tokens-css: .kor-travel-common/packages/tokens/tokens.css
      dark: true
