name: 동적 workflow fixture
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 22
          - 24
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-node@v4
        with:
          node-version:
            - 22
            - 24
