    reason: "`{error:{code,message,details}}` envelope가 `packages/schemas` Zod ErrorEnvelopeSchema·`packages/api-client`·모바일 `apps/mobile/lib/api.ts`까지 고정(oa §2.5·§4). 전환은 v2 prefix 도입 시점에 묶음. 선행 순서: export·drift(T-484) → securitySchemes → request-id additive → envelope."
