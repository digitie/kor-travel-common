# - 규칙 ID·계층·등록 규칙은 docs/standards/openapi.md §3·§6, BE-n 규칙은 docs/standards/backend-stack.md.
# - 항목 형식: {app, rule, surface, reason, sunset, review, owner} 7개 필드 고정.
#   sunset: ISO 날짜 또는 null(무기한). 계층 1 규칙(M2·M4·M9·M10·N6·N7)은 null 금지.
#   review: ISO 날짜(등록일 + 6개월 이내). 분기 감사(T-506)에서 재판정한다.
# - 사람이 읽는 표(docs/standards/openapi-exceptions.md)는 T-309에서 이 파일로부터 생성한다. 수기 편집 금지.
# - 근거 약칭 oa = docs/survey/cross/openapi.md, be = docs/survey/cross/backend.md (기준 커밋은 docs/survey/README.md §2.1).
# - 초기 등록: 브리프 D-14(2026-09-06). 실행 검증은 하지 않았고 조사 파일 기준 사실만 등록했다.

schema: kor-travel-common.openapi-exceptions.v1
updated: "2026-11-25"
apps: [airport, concierge, ktdm, geo, map, weather, pinvi]

exceptions:
  # ---------------------------------------------------------------- geo
  - app: geo
    rule: M3
    surface: "/v1/*"
    reason: "VWorld 호환 오류 객체(VWorldErrorEnvelope)·legacy `{response:{status,errorCode}}`는 외부 계약(oa §2.5). problem+json 적용 불가."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: M6
    surface: "/v1/*"
    reason: "v1 `Point{x=lon,y=lat}`는 VWorld 호환 계약(oa §2.7, geo ADR-060 §7). v2는 lon/lat 준수."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: N5
    surface: "/v1/*"
    reason: "M6 예외와 동일 사유(x/y 혼용은 VWorld 호환 legacy)."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: N2
    surface: "/v1/*"
    reason: "VWorld 호환 `?key=` 공개 키 수신(oa §2.4). 문서화된 legacy 예외. 신규 표면에는 헤더 `X-KTG-API-Key`만."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: M3
    surface: "/v2/*"
    reason: "v2 envelope `{status:'ERROR', query_id, error:{code,message,hint,field}}`(oa §2.5). `query_id`↔`request_id` 대응을 문서화하고 problem+json 채택 여부는 ADR-060 배포 전 breaking 묶음에서 판정(O-14)."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: S1
    surface: "/v2/*"
    reason: "v2 성공 envelope `{status, query_id, input, ...}`(oa §3.2 S1 비고). `{data, meta}` 미채택. M3 v2 항목과 같은 시점에 재판정."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: M3.1
    surface: "*"
    reason: "검증 오류 400(geo ADR-061 사용자 결정, FastAPI 422 억제; oa §2.5·Q2). common 기본 422과 다름."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: M5
    surface: "/v1/healthz, /v1/readyz"
    reason: "health 경로가 `/v1` 아래 `healthz`(oa §2.10). `/health`·`/readyz` 도입 후에도 별칭 병행. 소비자 probe(pinvi admin/system.py, ktdm healthcheck, Prometheus scrape) 갱신 확인 전까지 무기한(D-14). T-483."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: M8
    surface: "*"
    reason: "export본 `securitySchemes: None`; 키는 Header()/Query() 파라미터로만 노출(oa §2.4). 선언은 스펙 변경이므로 typegen 재생성과 함께 T-483."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo
  - app: geo
    rule: S7.1
    surface: "*"
    reason: "429 코드 `E0200`(admission control, oa §2.9). 앱 사전 덮어쓰기 유지."
    sunset: null
    review: "2026-12-31"
    owner: kor-travel-geo

