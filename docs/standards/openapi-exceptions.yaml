    sunset: null
    review: "2026-12-31"
    owner: pinvi
  - app: pinvi
    rule: M8
    surface: "*"
    reason: "export 없음으로 securitySchemes 선언 미확인(Cookie()/Header() 파라미터 방식, oa §2.4·Q12). T-484. `apiKey in=cookie` 선언."
    sunset: null
    review: "2026-12-31"
    owner: pinvi
  - app: pinvi
    rule: N5
    surface: "docs/api/common.md §4.2 bbox"
    reason: "bbox 문서 예시 `sw_lng,sw_lat,ne_lng,ne_lat`(oa §2.7). 코드 표면은 (lon, lat) 준수. 문서 정정은 pinvi 소유. T-484."
    sunset: null
    review: "2026-12-31"
    owner: pinvi
