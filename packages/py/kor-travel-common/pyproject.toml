[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kor-travel-common"
version = "0.1.0.dev0"
description = "kor-travel 공용 실행 복구 프리미티브"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
kor-travel-dagster-webserver = "kortravelcommon.dagster_webserver:main"
kor-travel-dagster-daemon = "kortravelcommon.daemon_pool:main"

[project.optional-dependencies]
reverse-address = [
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "python-vworld-api @ git+https://github.com/digitie/python-vworld-api@3b174abea1a1e734c60a9c2522b2844474a1ec71",
]
dagster = ["dagster>=1.9,<2"]
daemon-pool = ["dagster==1.13.24", "dagster-postgres==0.29.24", "SQLAlchemy==2.0.54"]
dagster-webserver = [
  "dagster-webserver>=1.13.24,<=1.13.25",
  "dagster-graphql>=1.13.24,<=1.13.25",
  "dagster-postgres>=0.29.24,<=0.29.25",
]
http = ["httpx>=0.27,<1.0"]
grpc-health = ["grpcio>=1.71,<2", "grpcio-health-checking>=1.71,<2", "protobuf>=5.29,<7"]
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kortravelcommon"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.entry-points."sqlalchemy.plugins"]
kortravel_daemon_pool = "kortravelcommon._daemon_pool_plugin:DaemonPoolPlugin"
